<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Arial', sans-serif;
          background-image: url(./images/wow_bg.webp);
          background-position: center;
          background-size: contain;
          background-color: #242424;
          color: #ffffff;
          backdrop-filter: blur(4px);
        }
        .header-cont {
          overflow: hidden;
          position: relative;

          height: 80px;
          @media (orientation: landscape) {
            height: 40px;
          }
        }
        .flex {
          display: flex;
        }
        .flex-center {
          justify-content: center;
          align-items: center;
        }
        .cont {
          padding: 0 2rem;
          flex-direction: column;
          height: calc(100vh - 150px);
          gap: 1rem;
        }
        .img-cont {
          max-width: 14rem;
        }
        .img {
          width: 18rem;
          max-width: 640px;
          @media (orientation: landscape) {
            max-height: 30vh;
          }
        }
        .header {
          margin: 0;
          font-weight: 600;
          text-align: center;
          color: #ffffff;
        }
        .header-bg {
          position: absolute;
          inset: 0;
          object-fit: cover;
          width: 100%;
          height: 100%;
        }
        .header-gradient {
          position: absolute;
          inset: 0;
          width: 100vw;
          background-color: rgb(0 0 0 / 0.3);
        }
        .header-img-cont {
          position: absolute;
          inset: 0;
          flex-direction: column;
          @media (orientation: landscape) {
            flex-direction: row;
            justify-content: space-between;
            padding-left: 3.5rem;
            padding-right: 3.5rem;
          }
        }
        .header-img {
          aspect-ratio: 1/1;
          height: 70px;
          margin-bottom: 1rem;
          @media (orientation: landscape) {
            height: 40px;
          }
        }

        .pubscale-cont {
          align-items: flex-end;
          gap: 0.25rem;
          position: absolute;
          bottom: 0.75rem;
          width: 100%;
          @media (orientation: landscape) {
            position: static;
            justify-self: flex-end;
          }
        }

        .pubscale-powered {
          position: relative;
          margin: 0;
          bottom: 0.1rem;
          font-size: 0.875rem /* 14px */;
          line-height: 1.25rem /* 20px */;
          font-weight: 700;
          color: #fff;
          font-size: 0.5rem;
          line-height: 0;
          @media (orientation: landscape) {
            font-size: 0.65rem;
            position: relative;
            bottom: -1px;
          }
        }
        .pubscale {
          font-size: 1.125rem /* 18px */;
          line-height: 1.75rem /* 28px */;
          color: #fff;
          @media (orientation: landscape) {
            font-size: 24px;
          }
        }

        .desc-cont {
          gap: 0.5rem;
        }
        .desc {
          text-align: center;
          font-size: 0.875rem;
          line-height: 24px;
          font-weight: 400;
          color: #ffffff60;
        }
        .retry-btn {
          font-size: 1rem;
          color: white;
          border-radius: 100vh;
          position: relative;
          padding: 0.65rem 1rem;
          width: 11rem;
          border: none;
          background: linear-gradient(180deg, #7b50e9 0%, #4e26b6 100%);
        }

        #close-btn {
          position: absolute;
          top: 0.5rem;
          right: 0.5rem;
          background: none;
          border: none;
          color: #ffffff;
          cursor: pointer;
          font-size: 26px;
        }
    </style>

    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <div class="desc">
        Please turn on your WiFi or mobile data to access the offers.
    </div>
    <button onclick="retry()" class="flex retry-btn flex-center">
        Retry
    </button>
</div>
<script>
    const btn = document.getElementById('close-btn');
    btn.addEventListener('click', function () {
      if (
        typeof window === 'undefined' ||
        typeof window.Android === 'undefined'
      )
        return;
      window.Android.closeOfferWall();
    });
    function retry() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        if (
          typeof window === 'undefined' ||
          typeof window.Android === 'undefined'
        )
          return;
        const url = window.Android.getOfferwallUrl();
        window.location.replace(url);
      }
    }
</script>
