name: Android Release

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app branch
        uses: actions/checkout@v4
        with:
          ref: app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret $name is not configured."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Calculate version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "code=$((RUN_NUMBER + 288))" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
          APPLOVIN_REWARDED_AD_UNIT_ID: ${{ secrets.APPLOVIN_REWARDED_AD_UNIT_ID }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number + 288 }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare release files
        id: release
        env:
          VERSION_CODE: ${{ github.run_number + 288 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "dist/AdCoin-${VERSION_CODE}.apk"
          echo "version=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdCoin-release-${{ steps.release.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AdCoin ${{ steps.release.outputs.tag }}
          target_commitish: app
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
